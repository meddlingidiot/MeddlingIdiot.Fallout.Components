# ============================================================================
# Mirror to on-prem Azure DevOps Server
# ============================================================================
#
# Pushes commits from the Azure DevOps Services (cloud) master repo to the
# on-prem DevOps Server copy. The cloud repo stays authoritative; on-prem is a
# downstream copy.
#
# Sibling of azure-pipelines-mirror.yml (GitHub). Deliberately a SEPARATE
# pipeline from both of them:
#   - a failing test must not stop the mirror
#   - an expired GitHub PAT must not stop this mirror, and vice versa
#   - PR builds must never push
#   - it needs no SDK, no feed auth, and no build
#
# NETWORK - sourcecontrol3.promiles.com is not reachable from a
# Microsoft-hosted agent. This job MUST run on the self-hosted pool, on a box
# inside the network. That is why 'Self-hosted' is not negotiable below.
#
# Setup (one time):
#   1. Create the repo on the on-prem server EMPTY - no README, no .gitignore.
#      (Azure DevOps Server offers to seed a README; decline it.)
#   2. Create a PAT on the on-prem server:
#        sourcecontrol3.promiles.com -> User settings -> Personal access tokens
#        Scope: Code (Read & write)
#      The PAT belongs to a user who must have Contribute on the target repo.
#   3. Add it to the 'Secrets' variable group as OnPremMirrorPat, marked
#      secret (the padlock).
#   4. Create a pipeline in Azure DevOps pointing at this file.
#
# ALTERNATIVE TO A PAT - if the self-hosted agent's service account already has
# Contribute on the on-prem repo, Windows integrated auth may work with no
# token at all. Leave OnPremMirrorPat empty and this job falls back to the
# agent's default credentials. It says which mode it used in the log.
#
# This pipeline never force-pushes. If on-prem has diverged, the push fails
# loudly instead of destroying commits.
#
# ----------------------------------------------------------------------------
# CURRENT STATE (2026-08-28): NOT ACTUALLY MIRRORING
# ----------------------------------------------------------------------------
# The build agent has no route to sourcecontrol3.promiles.com:443 and an IT
# ticket is open. Until it is fixed this job SKIPS the push and reports
# SucceededWithIssues - see skipWhenUnreachable in the variables below.
# The on-prem copy is therefore stale. Remove the three skip* variables and
# the section 3 bypass once connectivity is restored.
# ============================================================================

trigger:
  branches:
    include:
      - '*'
  tags:
    include:
      - 'v*'

# Never mirror pull request builds - the merge commit is not a real branch.
pr: none

name: mirror-onprem-$(Date:yyyyMMdd)$(Rev:.r)

variables:
  - group: Secrets # Should contain OnPremMirrorPat (optional - see ALTERNATIVE above)

  # Full target URL. Kept whole rather than composed from collection/project
  # parts because the collection name contains a space ('ProMiles Fuel Tax')
  # and re-encoding it by hand is a reliable way to break this.
  - name: onPremRemote
    value: 'https://sourcecontrol3.promiles.com/ProMiles%20Fuel%20Tax/FuelTaxAutomation/_git/Automation.Fallout.Components'

  # 'true' mirrors every branch on origin. Unlike the GitHub mirror - which
  # defaults to 'false' because feature branch names would be public - this
  # target is internal, so a full copy is both safe and more useful for DR.
  - name: mirrorAllBranches
    value: 'true'

  # LAST RESORT. Set to 'true' only if the on-prem server presents a cert the
  # agent does not trust and you cannot install the internal CA on the agent.
  # It disables TLS verification for this job's git calls and makes the push
  # vulnerable to interception. Installing the CA on the agent is the fix.
  #
  # As of 2026-08-28 this is NOT needed: sourcecontrol3 presents a public
  # Sectigo cert for *.promiles.com that chains cleanly. Leave it 'false'.
  - name: sslNoVerify
    value: 'false'

  # ------------------------------------------------------------------------
  # TEMPORARY - remove once the IT ticket below is closed.
  # ------------------------------------------------------------------------
  # The build agent has no route to sourcecontrol3 on 443 (the host resolves
  # to 10.102.30.45 and the agent sits outside that segment). Rather than fail
  # every build in the meantime, the job reports SucceededWithIssues and skips
  # the push when - and only when - the server is unreachable at the TCP level.
  #
  # This bypass is deliberately narrow. Anything that is not a connectivity
  # failure - bad PAT, missing repo, non-fast-forward, branch policy - still
  # fails the build, so a real problem cannot hide behind it.
  #
  # It also expires. After skipUntilUtc the job fails regardless, so a stalled
  # ticket surfaces instead of the mirror silently never running.
  - name: skipWhenUnreachable
    value: 'true'

  - name: skipUntilUtc
    value: '2026-09-30'

  - name: skipReason
    value: 'IT ticket open: no route from build agent to sourcecontrol3.promiles.com:443'

jobs:
  - job: MirrorOnPremJob
    displayName: 'Mirror to on-prem DevOps Server'
    pool:
      name: 'Self-hosted' # Required - the on-prem server is not publicly routable.

    steps:
      # ----------------------------------------------------------------
      # Full history is required: a shallow clone cannot be pushed.
      # persistCredentials lets us fetch the other branches from origin
      # when mirrorAllBranches is true.
      # ----------------------------------------------------------------
      - checkout: self
        displayName: 'Checkout Repository'
        fetchDepth: 0
        persistCredentials: true
        clean: false

      - powershell: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          function Write-Section { param([string] $Name) Write-Host ''; Write-Host "===== $Name =====" }

          $target = $env:ONPREM_REMOTE

          # ================================================================
          # 1. Context
          # ================================================================
          Write-Section 'Context'
          Write-Host "Agent           : $env:COMPUTERNAME"
          Write-Host "PowerShell      : $($PSVersionTable.PSVersion)"
          Write-Host "git             : $(& git --version)"
          Write-Host "Build reason    : $env:BUILD_REASON"
          Write-Host "Source ref      : $env:SOURCE_BRANCH"
          Write-Host "Target          : $target"
          Write-Host "Mirror all      : $env:MIRROR_ALL"
          Write-Host "HEAD            : $(& git rev-parse --short HEAD)  $(& git log -1 --format=%s)"

          # ================================================================
          # 2. Authentication mode
          #    A per-command header keeps the token out of .git/config and out
          #    of any process command line. It also overrides the Azure DevOps
          #    Services header that 'persistCredentials: true' wrote, which is
          #    scoped to dev.azure.com and would be rejected on-prem.
          #
          #    The two modes need OPPOSITE handling of credential.helper, and
          #    conflating them was a real bug here: blanking it unconditionally
          #    stopped a stored account from being substituted (right for the PAT
          #    mode) but also removed the only mechanism that could supply the
          #    agent's own credentials (fatal for the no-PAT mode), so that
          #    fallback could never work - it failed with
          #      could not read Username for '<server>': terminal prompts disabled
          #    which looks like a server problem and is not one.
          # ================================================================
          Write-Section 'Authentication'

          $gitAuth = @()

          if ([string]::IsNullOrWhiteSpace($env:ONPREM_PAT)) {
              # Integrated auth. The helper is left in place deliberately, and emptyAuth lets
              # git answer a Negotiate/NTLM challenge without demanding a username first -
              # without it, git prompts, and prompts are disabled on an agent.
              $gitAuth += @('-c', 'http.emptyAuth=true')

              Write-Host "Mode            : agent default credentials (OnPremMirrorPat is empty)"
              Write-Host "Running as      : $env:USERDOMAIN\$env:USERNAME"
              Write-Host ''
              Write-Host "This only works if the agent's service account has Contribute on the"
              Write-Host "target repo AND the server offers Windows integrated auth. If it does"
              Write-Host "not, add a PAT as OnPremMirrorPat - that is the supported path."
          }
          else {
              # Azure DevOps basic auth ignores the username; the PAT is the password.
              # credential.helper is blanked here so a credential manager on the agent cannot
              # substitute a different stored account for the token we were given.
              $basic  = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$($env:ONPREM_PAT)"))
              $gitAuth += @('-c', 'credential.helper=', '-c', "http.extraheader=AUTHORIZATION: basic $basic")
              Write-Host "Mode            : personal access token (OnPremMirrorPat)"
          }

          if ($env:SSL_NO_VERIFY -eq 'true') {
              $gitAuth += @('-c', 'http.sslVerify=false')
              Write-Host "##[warning]TLS verification is DISABLED for this job (sslNoVerify=true). Install the internal CA on the agent and set this back to 'false'."
          }

          # ================================================================
          # 3. Connectivity probe (TEMPORARY BYPASS - see variables)
          #    A plain TCP connect separates 'the agent cannot reach the box'
          #    from every other failure, so the bypass below can be limited to
          #    exactly that case. git's own 21-second timeout is also a slow
          #    way to learn the same thing.
          # ================================================================
          Write-Section 'Connectivity'

          $uri = [Uri] $target
          $reachable = $false
          $probe = New-Object System.Net.Sockets.TcpClient
          try   { $reachable = $probe.ConnectAsync($uri.Host, $uri.Port).Wait(10000) -and $probe.Connected }
          catch { $reachable = $false }
          finally { $probe.Dispose() }

          Write-Host ("TCP {0}:{1}   : {2}" -f $uri.Host, $uri.Port, $(if ($reachable) { 'reachable' } else { 'UNREACHABLE' }))

          if (-not $reachable) {
              $detail = @"
          Cannot open a TCP connection to $($uri.Host):$($uri.Port) from this agent ($env:COMPUTERNAME).

          The name resolves and the server is healthy from inside the network, so this is a
          routing or firewall problem between the agent and 10.102.30.0/24 - not TLS, and not
          the PAT. Confirm on the agent itself with:

            Test-NetConnection $($uri.Host) -Port $($uri.Port)
          "@

              if ($env:SKIP_WHEN_UNREACHABLE -ne 'true') { throw $detail }

              $expiry = [DateTime]::ParseExact($env:SKIP_UNTIL_UTC, 'yyyy-MM-dd', [Globalization.CultureInfo]::InvariantCulture)
              if ([DateTime]::UtcNow.Date -gt $expiry) {
                  throw @"
          $detail

          The temporary unreachable-bypass EXPIRED on $($expiry.ToString('yyyy-MM-dd')) and is no longer
          suppressing this failure. Reason it was added: $env:SKIP_REASON

          Either the connectivity issue is fixed (in which case remove skipWhenUnreachable,
          skipUntilUtc and skipReason from this file), or it is not and the ticket needs chasing.
          Push skipUntilUtc out only as a deliberate decision, not as a reflex.
          "@
              }

              $daysLeft = ($expiry - [DateTime]::UtcNow.Date).Days
              Write-Host "##vso[task.logissue type=warning]Mirror to on-prem SKIPPED - server unreachable from this agent. $env:SKIP_REASON. Bypass expires $env:SKIP_UNTIL_UTC ($daysLeft days left)."
              Write-Host ''
              Write-Host $detail
              Write-Host ''
              Write-Host "Nothing was pushed. The on-prem copy is now behind $(& git rev-parse --short HEAD)."
              Write-Host "This job is reported as SucceededWithIssues, not Succeeded, so the gap stays visible."
              Write-Host "##vso[task.complete result=SucceededWithIssues;]"
              exit 0
          }

          # ================================================================
          # 4. Reachability and write access
          #    ls-remote is the honest gate here: it proves DNS, TLS, routing
          #    and credentials in one call. There is no REST preflight because
          #    the _apis version varies by DevOps Server release.
          #    Reached only when the TCP probe above succeeded, so a failure
          #    here is auth or the repo - never connectivity - and is NOT
          #    covered by the temporary bypass.
          # ================================================================
          Write-Section 'Remote state before push'
          & git @gitAuth ls-remote --heads --tags $target
          if ($LASTEXITCODE -ne 0) {
              throw @"
          git ls-remote failed (exit $LASTEXITCODE) against $target

          The TCP probe already succeeded, so this is NOT a routing problem. Match the FIRST
          line of git's own output above - these causes look alike in a build log and are not:

            'could not read Username'  -> NO credentials were offered at all. git reached the
                                          server and had nothing to send. This is NOT a TLS
                                          problem and sslNoVerify will not change it. Either
                                          OnPremMirrorPat is empty or unmapped (check the
                                          'Mode' line in the Authentication section above), or
                                          integrated auth is not on offer from the server.
                                          Fix: add the PAT to the 'Secrets' variable group.

            'SSL certificate problem'  -> and only this wording is TLS. The agent does not
                                          trust the server's CA; install it on the agent, or
                                          set sslNoVerify=true as a last resort.

            'Authentication failed' / 401
                                       -> credentials WERE sent and rejected. The PAT is
                                          expired, or its user lacks Contribute on the repo.

            'repository not found' / 404
                                       -> the repo does not exist on the server yet; create it
                                          EMPTY first (see Setup at the top of this file).
          "@
          }

          function Push-ToOnPrem {
              param([Parameter(ValueFromRemainingArguments = $true)] [string[]] $PushArgs)

              Write-Host "> git push $($PushArgs -join ' ')"
              & git @gitAuth push @PushArgs
              if ($LASTEXITCODE -ne 0) {
                  throw @"
          git push failed (exit $LASTEXITCODE). Read the 'remote:' lines above; the usual causes are:
            'TF401027' / 'denied'             -> the PAT's user lacks Contribute on the target repo
            'non-fast-forward' / 'fetch first'-> on-prem has commits the cloud repo does not;
                                                 reconcile by hand (see Seeding at the bottom)
            'VS403654' / branch policy        -> a branch policy on-prem is rejecting the push;
                                                 leave mirrored branches unpoliced
            'RPC failed' / 'HTTP 413'         -> push too large for the server's request limit;
                                                 seed once from a local clone instead
          "@
              }
          }

          # ================================================================
          # 5. Push
          # ================================================================
          Write-Section 'Push'
          $sourceRef = $env:SOURCE_BRANCH

          if ($sourceRef -like 'refs/tags/*') {
              $tag = $sourceRef -replace '^refs/tags/', ''
              Write-Host "Tag build: pushing tag $tag"
              Push-ToOnPrem $target "refs/tags/$($tag)"
          }
          elseif ($env:MIRROR_ALL -eq 'true') {
              Write-Host 'Mirroring all branches'
              & git fetch origin --prune --tags "+refs/heads/*:refs/remotes/origin/*"
              if ($LASTEXITCODE -ne 0) { throw "git fetch failed (exit $LASTEXITCODE)" }

              # strip=3 turns refs/remotes/origin/feature/x into feature/x
              $branches = & git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin |
                          Where-Object { $_ -and $_ -ne 'HEAD' }

              foreach ($branch in $branches) {
                  Push-ToOnPrem $target "refs/remotes/origin/$($branch):refs/heads/$($branch)"
              }
              Push-ToOnPrem $target '--tags'
          }
          else {
              # Branch build. Build.SourceBranchName is only the last segment
              # ('nukemigration' for feature/nukemigration), so derive the real
              # name from the full ref. The checkout is a detached HEAD, which is
              # why this pushes HEAD rather than a local branch name.
              $branch = $sourceRef -replace '^refs/heads/', ''
              Write-Host "Branch build: pushing $branch"
              Push-ToOnPrem $target "HEAD:refs/heads/$($branch)"
              Push-ToOnPrem $target '--tags'
          }

          Write-Section 'Remote state after push'
          & git @gitAuth ls-remote --heads --tags $target

          Write-Host ''
          Write-Host 'Mirror complete.'
        displayName: 'Push to on-prem DevOps Server'
        env:
          ONPREM_PAT: $(OnPremMirrorPat) # Secret variables are not auto-exposed to scripts
          ONPREM_REMOTE: $(onPremRemote)
          MIRROR_ALL: $(mirrorAllBranches)
          SSL_NO_VERIFY: $(sslNoVerify)
          SKIP_WHEN_UNREACHABLE: $(skipWhenUnreachable) # TEMPORARY - see variables
          SKIP_UNTIL_UTC: $(skipUntilUtc)
          SKIP_REASON: $(skipReason)
          SOURCE_BRANCH: $(Build.SourceBranch)
          BUILD_REASON: $(Build.Reason)

# ============================================================================
# Seeding an existing (non-empty) on-prem repo
# ============================================================================
# If on-prem already has commits the cloud repo does not, the first push is
# rejected. Reconcile once from a local clone, then let this pipeline take over:
#
#   git remote add onprem https://sourcecontrol3.promiles.com/ProMiles%20Fuel%20Tax/FuelTaxAutomation/_git/Automation.Fallout.Components
#   git push onprem main --force     # destroys the on-prem history
#   git push onprem --tags
#
# Seeding from a local clone is also the workaround if the first automated push
# is too large for the server's request size limit.
#
# ============================================================================
# Notes
# ============================================================================
# - This job only works on the Self-hosted pool, AND only from an agent with a
#   route into 10.102.30.0/24. Verified 2026-08-28: the current agent has
#   neither. sourcecontrol3 answers on 443 from inside the network (HTTP 401,
#   valid public cert), so the server is fine - the agent's position is not.
# - Removing the temporary bypass: delete skipWhenUnreachable, skipUntilUtc and
#   skipReason from the variables, delete section 3 of the script, and renumber
#   sections 4 and 5. The ls-remote gate then catches connectivity again, just
#   more slowly.
# - On-prem PATs expire like cloud ones, and the default lifetime is often
#   shorter. When pushes start failing with 401, regenerate and update
#   OnPremMirrorPat. Set a calendar reminder.
# - Branch policies on the on-prem side will reject these pushes. Leave the
#   mirrored branches unpoliced, or allow the PAT's user to bypass.
# - Branch DELETIONS do not propagate. A branch removed in the cloud stays on
#   the on-prem copy until someone deletes it there. This is the deliberate
#   cost of never running a destructive push; prune by hand if it matters.
# - This mirrors code only. Work items, PRs, and pipeline history stay in
#   Azure DevOps Services.
# - A true 'git push --mirror' is deliberately not used: it deletes refs that
#   exist only on-prem and force-updates everything else.
# ============================================================================
